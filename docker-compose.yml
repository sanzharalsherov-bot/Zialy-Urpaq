services:
  postgres:
    image: postgres:17-alpine
    container_name: school-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolcrm
      POSTGRES_USER: schoolcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolcrm_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - school_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolcrm -d schoolcrm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  school_crm_pgdata:
