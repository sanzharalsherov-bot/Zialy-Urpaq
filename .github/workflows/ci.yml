name: Verify and package Zaily Urpaq

on:
  push:
    branches:
      - dev
      - "fix/**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://schoolcrm:ci-only-password@localhost:5432/schoolcrm
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Run tests
        run: npm test
      - name: Build production applications
        run: npm run build

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build graphical installer
        shell: powershell
        run: .\packaging\windows\Build-Installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZailyUrpaqSetup-windows-x64
          path: packaging/windows/dist/ZailyUrpaqSetup*.exe
          if-no-files-found: error
          retention-days: 14
